<!-- Adicione dentro do seu agenda.html, antes do painel de horários -->

<section class="mb-5 rounded-2xl border border-white/10 bg-zinc-900/60 p-4">
    {% if whatsapp_preference and whatsapp_preference.opt_in %}
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
                <strong class="text-sm text-emerald-300">
                    WhatsApp ativado
                </strong>
                <p class="mt-1 text-xs text-zinc-500">
                    Você receberá confirmação e lembrete do agendamento.
                </p>
            </div>

            <a
                href="{{ url_for('whatsapp.settings') }}"
                class="rounded-xl border border-white/10 px-3 py-2 text-xs font-bold text-zinc-300 hover:bg-white/5"
            >
                Configurar
            </a>
        </div>
    {% else %}
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
                <strong class="text-sm text-white">
                    Receba confirmação pelo WhatsApp
                </strong>
                <p class="mt-1 text-xs text-zinc-500">
                    Ative também o lembrete quando seu horário estiver próximo.
                </p>
            </div>

            <a
                href="{{ url_for('whatsapp.settings') }}"
                class="rounded-xl bg-barber-400 px-3 py-2 text-xs font-black text-zinc-950 hover:bg-barber-300"
            >
                Ativar WhatsApp
            </a>
        </div>
    {% endif %}
</section>
