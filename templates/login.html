{% extends "base.html" %}

{% block title %}Entrar — Gringo Barber{% endblock %}

{% block content %}

<section class="grid min-h-[68vh] place-items-center py-5">

    <div class="grid w-full max-w-5xl overflow-hidden rounded-[2rem] border border-white/10 bg-zinc-900/75 shadow-2xl shadow-black/40 lg:grid-cols-[.95fr_1.05fr]">

        <aside class="relative hidden min-h-[600px] overflow-hidden lg:block">

            <img
                src="{{ url_for('static', filename='imagens/gringo-logo.jpg') }}"
                alt="Gringo Barber"
                class="absolute inset-0 h-full w-full object-cover"
            >

            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-black/5"></div>

            <div class="absolute inset-x-0 bottom-0 p-9">

                <div class="mb-5 flex w-24 overflow-hidden rounded-full">
                    <span class="h-1.5 flex-1 bg-[#df2610]"></span>
                    <span class="h-1.5 flex-1 bg-[#f5f5f4]"></span>
                    <span class="h-1.5 flex-1 bg-[#3f6d87]"></span>
                </div>

                <span class="text-xs font-black uppercase tracking-[.18em] text-[#f58b46]">
                    GRINGO BARBER
                </span>

                <h1 class="mt-3 max-w-sm text-4xl font-black tracking-tight text-white">
                    Corte marcado. Estilo garantido.
                </h1>

            </div>

        </aside>

        <form method="post" class="p-7 sm:p-10 lg:p-12">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <span class="text-xs font-black uppercase tracking-[.18em] text-[#f58b46]">
                ÁREA DO CLIENTE
            </span>

            <h2 class="mt-3 text-4xl font-black tracking-tight text-white">
                Bem-vindo de volta.
            </h2>

            <p class="mt-3 text-sm leading-6 text-zinc-500">
                Entre para acessar sua agenda e seus atendimentos.
            </p>

            <div class="mt-8 space-y-5">

                <label class="block">
                    <span class="mb-2 block text-sm font-black text-zinc-300">
                        E-mail
                    </span>

                    <input
                        type="email"
                        name="email"
                        autocomplete="email"
                        required
                        placeholder="voce@exemplo.com"
                        class="w-full rounded-2xl border border-white/10 bg-[#0d0d0f] px-4 py-3.5 text-white outline-none transition placeholder:text-zinc-700 focus:border-[#f4600d]/60 focus:ring-4 focus:ring-[#f4600d]/10"
                    >
                </label>

                <label class="block">
                    <span class="mb-2 block text-sm font-black text-zinc-300">
                        Senha
                    </span>

                    <input
                        type="password"
                        name="password"
                        autocomplete="current-password"
                        required
                        placeholder="••••••••"
                        class="w-full rounded-2xl border border-white/10 bg-[#0d0d0f] px-4 py-3.5 text-white outline-none transition placeholder:text-zinc-700 focus:border-[#f4600d]/60 focus:ring-4 focus:ring-[#f4600d]/10"
                    >
                </label>

                <button
                    type="submit"
                    class="w-full rounded-2xl bg-gradient-to-r from-[#f4600d] to-[#ef9e34] px-5 py-3.5 font-black text-black shadow-lg shadow-orange-950/20 transition hover:brightness-110"
                >
                    Entrar
                </button>

            </div>

            <div class="mt-7 border-t border-white/5 pt-6 text-center text-sm text-zinc-500">
                Ainda não tem conta?
                <a
                    href="{{ url_for('auth.register') }}"
                    class="font-black text-[#f58b46] hover:text-[#ffb079]"
                >
                    Criar minha conta
                </a>
            </div>

        </form>

    </div>

</section>

{% endblock %}
